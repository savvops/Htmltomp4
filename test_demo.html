<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .box {
            width: 100px;
            height: 100px;
            background: #00ff88;
            animation: spin 2s infinite linear;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <h1>Verified!</h1>
</body>

</html>
